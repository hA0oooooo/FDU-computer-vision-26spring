seed: 0
num_threads: 1
data_dir: data/raw
split_path: data/splits/split_indices.npz
checkpoint_path: outputs/checkpoints/best.npz
best_meta_path: outputs/logs/best.json
history_path: outputs/logs/history.json
loss_plot_path: outputs/plots/train_loss.png
val_acc_plot_path: outputs/plots/val_acc.png
hidden_dim: 256
activation: swilu
batch_size: 256
epochs: 100
lr: 0.1
weight_decay: 1e-5
val_ratio: 0.2
# early stopping
early_stopping: true
patience: 10
min_delta: 1e-4
# learning rate decay
lr_decay_step: 10
lr_decay_gamma: 0.7

verbose: true
save_best_model: true
save_best_meta: true
save_history: true
save_plots: true
